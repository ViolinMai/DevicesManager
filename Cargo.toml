[package]
name = "DevicesManager"
version = "0.1.0"
edition = "2024"

[lib]
name = "devices_manager"
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "connection_protocol"
path = "src/bin/cli.rs"

[dependencies]
quinn = { version = "0.11.12", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
] }
hex = "0.4.3"
sha2 = "0.11.0"
rcgen = "0.14.10"
rustls = { version = "0.23.45", features = ["ring"] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
whoami = "2.1.3"
tokio-util = "0.7"
flutter_rust_bridge = "=2.13.0"
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
ndk-context = "0.1"
